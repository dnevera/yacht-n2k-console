# Sensor/service definitions the "Sailing" dashboard depends on, beyond the
# raw NMEA2000 entities that ydnu02_tcp_gateway publishes on its own.
#
# These snippets live in the live HA instance's /config/configuration.yaml
# (top-level `rest:` / `template:` keys — HA list-merges every `!include`d
# file plus the main file under the same key, so this file's blocks can be
# merged in as their own included files, see deploy_dashboard.sh --sensors).
# Extracted from bumblebee.local on 2026-08-09.
#
# Data flow for the "Wind History & Forecast" chart on the dashboard:
#   api.open-meteo.com (REST, no API key needed)
#     -> sensor.wind_forecast_rest      (rest: platform, polls every 15 min)
#     -> sensor.wind_forecast_flat      (template: platform, flattens the
#                                         `hourly` json_attributes into the
#                                         forecast_time/forecast_wind/
#                                         forecast_gust arrays apexcharts-card
#                                         reads via data_generator)
#
# Apply: merge the `rest:`/`template:` blocks below into the host's
# configuration.yaml (or `!include` them as separate files under those keys),
# then restart Home Assistant core (Settings -> System -> Restart) — unlike
# the dashboard JSON itself, sensor/service config changes DO require a
# full HA restart to take effect (they are not storage-mode/hot-reloadable).
#
# NOTE on location: HA also ships a native "Open-Meteo" integration
# (config-flow based), but it was evaluated (2026-08-09) and rejected for
# this purpose — its hourly forecast only exposes condition/precipitation/
# temperature, NOT wind_speed/wind_gust (wind is only available as a daily
# max or in "current"), so it cannot feed this chart. The REST resource
# below is templated on the boat's own live N2K GPS position (the same
# sensors device_tracker.nevera/boat_latitude/boat_longitude use), so the
# forecast follows the boat instead of a fixed anchorage.
#
# OPEN-METEO API LIMITS (key-less free/non-commercial tier). The numbers
# below were verified 2026-08-09 by probing both endpoints directly (not
# taken from the docs), by counting the returned `hourly.time` points:
#
#   Forecast horizon — `forecast_days`, allowed range 0..16 on BOTH APIs
#     (17 -> HTTP 400 "Allowed range 0 to 16"):
#       api.open-meteo.com/v1/forecast   forecast_days=16 -> 384 hourly pts
#                                        (today 00:00 .. +15 days 23:00)
#       marine-api.open-meteo.com/v1/... forecast_days=16 -> 384 hourly pts
#     So the max usable forecast is ~16 days at hourly resolution. Docs
#     default is 7 days; accuracy degrades after ~5 days (high-resolution
#     models end there, the rest is the global ~25 km model), and the wave
#     models are only really skilful for ~7-8 days.
#     We deliberately request `forecast_days=2`: the charts only draw
#     Now+24h (see the time-window comments in dashboard-sailing.yaml), so
#     a longer request would just bloat the sensor attributes.
#
#   History — `past_days`, allowed range 0..93 on BOTH APIs (94 -> HTTP
#     400); `past_hours` exists for finer granularity. Verified:
#     past_days=93 -> 2400 hourly pts starting 93 days back. These past
#     values come from the models' own reanalysis, NOT from measurements.
#     Anything older than 93 days needs the separate *Archive* API
#     (archive-api.open-meteo.com/v1/archive, ERA5, 1940-01-01 onwards,
#     ~5 days behind real time) — different endpoint, not used here.
#     We never pass past_days at all: the dashboard's history comes from
#     HA's recorder, i.e. real Raymarine measurements.
#
#   Call quota (free tier, no API key): ~10 000 calls/day, 5 000/hour,
#     600/minute (non-commercial fair use). `scan_interval: 900` (15 min)
#     = 96 calls/day per endpoint, ~1 % of the daily budget — safe.

# SINGLE SOURCE OF TRUTH FOR THE TIME WINDOW (added 2026-08-09).
# `sensor.chart_time_window` (defined in the `template:` section below) is
# the ONLY place where the chart window / API horizon is configured:
#
#   history_hours   hours of measured history shown left of "Now"
#   forecast_hours  hours of open-meteo forecast shown right of "Now"
#   forecast_days   NOT stored as an attribute - computed straight in the
#                   REST URLs (open-meteo only accepts whole days, 0..16).
#                   IMPORTANT (fixed 2026-08-09): open-meteo counts
#                   forecast_days from TODAY 00:00 UTC, not from "now", so
#                   ceil(forecast_hours / 24) is too short - with
#                   forecast_hours=72 at 18:00 UTC it returned only 3 days
#                   = 53 h ahead (the chart stopped on Aug 11). The URLs
#                   therefore use
#                     ceil((hours_elapsed_today_utc + forecast_hours) / 24)
#                   capped at 16, which always covers the full requested
#                   horizon.
#                   Startup race (harmless): right after an HA restart the
#                   rest: platform builds its URL before the template
#                   sensor exists, so the `| int(48)` fallback is used for
#                   the first poll; the next poll (<= scan_interval, 15 min)
#                   picks up the real value. Force it immediately with
#                   `homeassistant.update_entity` on
#                   sensor.wind_forecast_rest / sensor.wave_forecast_rest.
#
# Both REST requests below take forecast_days from it, and BOTH
# `custom:plotly-graph` cards in dashboard-sailing.yaml take
# hours_to_show / time_offset from it via `$fn ({ hass }) => ...`
# (plotly-graph-card resolves those keys through getFromConfig, i.e. the
# same $fn/$ex evaluator that powers the traces - verified against the
# installed bundle in local-preview/).
# => to change the window, edit ONE place: the chart_time_window sensor.

rest:
  - resource_template: >-
      https://api.open-meteo.com/v1/forecast?latitude={{ states('sensor.position_rapid_update_raymarine_display_1180407_pk_dbdf6a933ca2a0c28e21602200f43fa1_latitude') | float(42.43) }}&longitude={{ states('sensor.position_rapid_update_raymarine_display_1180407_pk_dbdf6a933ca2a0c28e21602200f43fa1_longitude') | float(18.60) }}&hourly=windspeed_10m,windgusts_10m,winddirection_10m&wind_speed_unit=kn&forecast_days={{ [ (((utcnow().hour + utcnow().minute / 60) + (state_attr('sensor.chart_time_window', 'forecast_hours') | int(48))) / 24) | round(0, 'ceil') | int, 16 ] | min }}&timezone=UTC
    scan_interval: 900
    sensor:
      - name: 'Wind Forecast REST'
        unique_id: wind_forecast_rest
        icon: mdi:weather-windy
        value_template: "{{ value_json.hourly.windspeed_10m | list | first | round(1) }}"
        unit_of_measurement: 'kts'
        json_attributes:
          - hourly

  # Open-Meteo *Marine* API (separate host, also key-less) — feeds the
  # "Waves" dashboard section. Same resource_template trick as the wind
  # forecast above, so the wave forecast follows the boat's live N2K GPS
  # position. Note: the marine model only covers open sea — inside closed
  # bays/marinas the API can legitimately return null values.
  # LIMITS: same as the weather API — forecast_days 0..16, past_days 0..93
  # (verified live); see the API-limits block at the top of this file.
  - resource_template: >-
      https://marine-api.open-meteo.com/v1/marine?latitude={{ states('sensor.position_rapid_update_raymarine_display_1180407_pk_dbdf6a933ca2a0c28e21602200f43fa1_latitude') | float(42.43) }}&longitude={{ states('sensor.position_rapid_update_raymarine_display_1180407_pk_dbdf6a933ca2a0c28e21602200f43fa1_longitude') | float(18.60) }}&hourly=wave_height,wave_direction,wave_period&forecast_days={{ [ (((utcnow().hour + utcnow().minute / 60) + (state_attr('sensor.chart_time_window', 'forecast_hours') | int(48))) / 24) | round(0, 'ceil') | int, 16 ] | min }}&timezone=UTC
    scan_interval: 900
    sensor:
      - name: 'Wave Forecast REST'
        unique_id: wave_forecast_rest
        icon: mdi:waves
        value_template: "{{ value_json.hourly.wave_height | list | first | round(1) }}"
        unit_of_measurement: 'm'
        json_attributes:
          - hourly

template:
  - sensor:
      # ------------------------------------------------------------------
      # THE one place to configure the charts' time window and, through
      # forecast_days, how much data the open-meteo APIs are asked for.
      # Consumers:
      #   * both rest: resource_template URLs above (forecast_days)
      #   * both custom:plotly-graph cards, which derive
      #       hours_to_show = history_hours + forecast_hours
      #       time_offset   = forecast_hours + 'h'
      # Limits: forecast_hours <= 384 (forecast_days 0..16) - see the
      # OPEN-METEO API LIMITS block at the top of this file.
      # ------------------------------------------------------------------
      - name: Chart Time Window
        unique_id: chart_time_window
        icon: mdi:chart-timeline-variant
        # >>> THE ONLY TWO NUMBERS TO EDIT <<<
        #   history_hours   measured history drawn left of "Now"
        #   forecast_hours  open-meteo forecast drawn right of "Now"
        #                   (also decides forecast_days on both REST URLs)
        attributes:
          history_hours: "{{ 4 }}"
          forecast_hours: "{{ 72 }}"
        state: >
          {{ state_attr('sensor.chart_time_window', 'history_hours') }}h back /
          {{ state_attr('sensor.chart_time_window', 'forecast_hours') }}h ahead

      # Flattened open-meteo wind forecast — used by the apexcharts-card
      # "Wind History & Forecast" series (dashboard-sailing.yaml).
      # forecast_dir (winddirection_10m, degrees) added 2026-08-09 to feed
      # the new "Wind Direction — History & Forecast" chart.
      - name: Wind Forecast Flat
        unique_id: wind_forecast_flat
        unit_of_measurement: 'kts'
        icon: mdi:weather-windy
        state: "{{ states('sensor.wind_forecast_rest') }}"
        attributes:
          forecast_time: "{{ state_attr('sensor.wind_forecast_rest', 'hourly')['time'] if state_attr('sensor.wind_forecast_rest', 'hourly') else [] }}"
          forecast_wind: "{{ state_attr('sensor.wind_forecast_rest', 'hourly')['windspeed_10m'] if state_attr('sensor.wind_forecast_rest', 'hourly') else [] }}"
          forecast_gust: "{{ state_attr('sensor.wind_forecast_rest', 'hourly')['windgusts_10m'] if state_attr('sensor.wind_forecast_rest', 'hourly') else [] }}"
          forecast_dir: "{{ state_attr('sensor.wind_forecast_rest', 'hourly')['winddirection_10m'] if state_attr('sensor.wind_forecast_rest', 'hourly') else [] }}"

      # Next full forecast hour from open-meteo, exposed as a plain numeric
      # sensor so the vector chart's header row can show it the same way
      # apexcharts-card's own header shows its series states (added 2026-08-09).
      - name: Wind Forecast Next Hour
        unique_id: wind_forecast_next_hour
        unit_of_measurement: 'kts'
        icon: mdi:weather-windy
        state: >
          {% set times = state_attr('sensor.wind_forecast_flat', 'forecast_time') or [] %}
          {% set vals = state_attr('sensor.wind_forecast_flat', 'forecast_wind') or [] %}
          {% set ns = namespace(v = none) %}
          {% for t in times %}
            {% if ns.v is none and as_timestamp(t ~ '+00:00', 0) >= as_timestamp(now()) %}
              {% set ns.v = vals[loop.index0] %}
            {% endif %}
          {% endfor %}
          {{ (ns.v | float(0)) | round(1) if ns.v is not none else 'unknown' }}

      # Next full forecast hour from open-meteo, exposed as a plain numeric
      # sensor so the vector chart's header row can show it the same way
      # apexcharts-card's own header shows its series states (added 2026-08-09).
      - name: Wind Gust Next Hour
        unique_id: wind_gust_next_hour
        unit_of_measurement: 'kts'
        icon: mdi:weather-windy-variant
        state: >
          {% set times = state_attr('sensor.wind_forecast_flat', 'forecast_time') or [] %}
          {% set vals = state_attr('sensor.wind_forecast_flat', 'forecast_gust') or [] %}
          {% set ns = namespace(v = none) %}
          {% for t in times %}
            {% if ns.v is none and as_timestamp(t ~ '+00:00', 0) >= as_timestamp(now()) %}
              {% set ns.v = vals[loop.index0] %}
            {% endif %}
          {% endfor %}
          {{ (ns.v | float(0)) | round(1) if ns.v is not none else 'unknown' }}

      # Flattened open-meteo marine wave forecast — feeds the
      # "Wave Height & Direction" plotly vector chart the same way
      # wind_forecast_flat feeds the wind one (added 2026-08-09).
      - name: Wave Forecast Flat
        unique_id: wave_forecast_flat
        unit_of_measurement: 'm'
        icon: mdi:waves
        state: "{{ states('sensor.wave_forecast_rest') }}"
        attributes:
          forecast_time: "{{ state_attr('sensor.wave_forecast_rest', 'hourly')['time'] if state_attr('sensor.wave_forecast_rest', 'hourly') else [] }}"
          wave_height: "{{ state_attr('sensor.wave_forecast_rest', 'hourly')['wave_height'] if state_attr('sensor.wave_forecast_rest', 'hourly') else [] }}"
          wave_direction: "{{ state_attr('sensor.wave_forecast_rest', 'hourly')['wave_direction'] if state_attr('sensor.wave_forecast_rest', 'hourly') else [] }}"
          wave_period: "{{ state_attr('sensor.wave_forecast_rest', 'hourly')['wave_period'] if state_attr('sensor.wave_forecast_rest', 'hourly') else [] }}"

      # Next full forecast hour, plain numeric sensors for the "Waves"
      # header row (same pattern as wind_forecast_next_hour).
      - name: Wave Height Next Hour
        unique_id: wave_height_next_hour
        unit_of_measurement: 'm'
        icon: mdi:waves
        state: >
          {% set times = state_attr('sensor.wave_forecast_flat', 'forecast_time') or [] %}
          {% set vals = state_attr('sensor.wave_forecast_flat', 'wave_height') or [] %}
          {% set ns = namespace(v = none) %}
          {% for t in times %}
            {% if ns.v is none and as_timestamp(t ~ '+00:00', 0) >= as_timestamp(now()) %}
              {% set ns.v = vals[loop.index0] %}
            {% endif %}
          {% endfor %}
          {{ (ns.v | float(0)) | round(1) if ns.v is not none else 'unknown' }}

      - name: Wave Period Next Hour
        unique_id: wave_period_next_hour
        unit_of_measurement: 's'
        icon: mdi:waves-arrow-up
        state: >
          {% set times = state_attr('sensor.wave_forecast_flat', 'forecast_time') or [] %}
          {% set vals = state_attr('sensor.wave_forecast_flat', 'wave_period') or [] %}
          {% set ns = namespace(v = none) %}
          {% for t in times %}
            {% if ns.v is none and as_timestamp(t ~ '+00:00', 0) >= as_timestamp(now()) %}
              {% set ns.v = vals[loop.index0] %}
            {% endif %}
          {% endfor %}
          {{ (ns.v | float(0)) | round(1) if ns.v is not none else 'unknown' }}

      # Wind direction (0-360°, true wind angle from the mast sensor, NOT
      # apparent-relative — same raw entity used by the Wind compass-card),
      # exposed as its own numeric sensor purely so HA's recorder keeps a
      # plain history for it that apexcharts-card can plot directly (the
      # raw PGN 130306 entity already has history too, but this normalizes
      # units/rounding for the chart below).
      - name: Wind Direction History
        unique_id: wind_direction_history
        unit_of_measurement: '°'
        icon: mdi:compass-rose
        state: >
          {{ states('sensor.wind_data_raymarine_20_442559_pk_a00872849cc8b861a8f51deb51cc1cd2_wind_angle') | float(0) | round(0) }}

      # Re-derives barometric pressure from the N2K-published outboard
      # pressure sensor, converted to mmHg — used by the "Position" section
      # gauge. Source sensor reports either hPa (>200) or kPa (<=200)
      # depending on firmware/units, hence the branch.
      - name: Barometer mmHg
        unique_id: barometer_mmhg
        unit_of_measurement: mmHg
        device_class: pressure
        state: >
          {% set p = states('sensor.outboard_pressure') | float(0) %}
          {{ (p * 0.750062) | round(1) if p > 200 else (p * 7.50062) | round(1) }}

      # Human-readable degrees/minutes lat/lon — reformats the raw N2K
      # decimal-degree position sensors for the "Position" section entities.
      - name: Boat Latitude
        unique_id: boat_latitude
        icon: mdi:latitude
        state: >
          {% set v = states('sensor.position_rapid_update_raymarine_display_1180407_pk_dbdf6a933ca2a0c28e21602200f43fa1_latitude') | float(0) %}
          {% set d = v | abs | int %}{% set m = ((v | abs) - d) * 60 %}
          {{ d }}°{{ '%.2f' | format(m) }}'{{ 'N' if v >= 0 else 'S' }}

      - name: Boat Longitude
        unique_id: boat_longitude
        icon: mdi:longitude
        state: >
          {% set v = states('sensor.position_rapid_update_raymarine_display_1180407_pk_dbdf6a933ca2a0c28e21602200f43fa1_longitude') | float(0) %}
          {% set d = v | abs | int %}{% set m = ((v | abs) - d) * 60 %}
          {{ d }}°{{ '%.2f' | format(m) }}'{{ 'E' if v >= 0 else 'W' }}

  # The dashboard's map card uses this boat-GPS device_tracker (entity_id
  # device_tracker.nevera), derived from the N2K position sensors above —
  # NOT device_tracker.iphone_17_promax_nevera (HA Companion App / phone GPS),
  # which tracks the crew member's phone rather than the boat and is
  # therefore not accurate when the phone isn't aboard or is off/out of
  # signal. device_tracker.iphone_17_promax_nevera still exists as an
  # optional entity (Companion App), just not used by this dashboard.
  - device_tracker:
      - name: Nevera
        unique_id: nevera_boat_gps
        latitude: >
          {{ states('sensor.position_rapid_update_raymarine_display_1180407_pk_dbdf6a933ca2a0c28e21602200f43fa1_latitude') | float(0) }}
        longitude: >
          {{ states('sensor.position_rapid_update_raymarine_display_1180407_pk_dbdf6a933ca2a0c28e21602200f43fa1_longitude') | float(0) }}
        icon: mdi:sail-boat
