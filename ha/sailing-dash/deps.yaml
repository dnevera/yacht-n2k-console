# Single source of truth for every EXTERNAL artifact this dashboard needs.
#
# Nothing here is committed into the repo: `fetch_deps.py` downloads all of it
# into `build/deps/` (an ordinary build artifact directory next to
# `build/dashboard-sailing.yaml`, gitignored) and the deploy/provision scripts
# take it from there. There is no `vendor/` copy and no `.cache/` any more.
#
# Everything is pinned to a TAG (never a branch): two "from scratch" installs on
# different days must produce byte-identical code. `sha256` is verified on every
# fetch; refresh it with `python3 fetch_deps.py --update-hashes` after a bump.

# ── Python library (decoder) ────────────────────────────────────────────────
# Installed with pip, NOT downloaded into build/deps/: it goes into our venv /
# Docker image via the repo root requirements.txt, and into the HA container via
# the integration's manifest.json requirement. Declared here so the fork tag
# lives in exactly one place.
lib:
  - name: nmea2000
    source: git
    repo: dnevera/nmea2000          # OUR OWN fork of tomer-w/nmea2000
    ref: cpu-overload-fix           # tag, commit 6c9df918d19a (both fixes in)
    # Content markers used by the drift-guard to prove the fork (not PyPI) is
    # what actually got installed.
    markers:
      - file: nmea2000/ioclient.py
        contains: "Connection closed by remote host"
      - file: nmea2000/message.py
        contains: 'primary_key = f"{self.id}_{source_id}"'

# ── HA custom integrations ──────────────────────────────────────────────────
integrations:
  - name: nmea2000
    source: github_tag_archive
    repo: dnevera/ha-nmea2000       # OUR OWN fork of tomer-w/ha-nmea2000
    ref: ydnu-02-usb-tcp-gw         # tag, commit 2cdef78c6df2
    # Path of the component inside the extracted archive.
    component_path: custom_components/nmea2000
    sha256: "fb0b882bd9fd52d225f886dd3780f21c87a9b863f0b49d49b469326d2fdd1ea8"
  - name: hacs
    source: github_release_asset
    repo: hacs/integration
    ref: latest                     # HACS is self-updating; pin only if needed
    asset: hacs.zip
    component_path: custom_components/hacs
    sha256: null                    # `latest` is a moving target — not verified

# ── Lovelace frontend cards ─────────────────────────────────────────────────
# On Prod these are installed through the HACS UI; on Stage they are copied
# straight into /config/www/ from build/deps/cards/ (identical runtime effect).
cards:
