# Generated by map_nmea_sensors.py — DO NOT EDIT MANUALLY
template:
  - sensor:
      - name: Boat STW
        unique_id: boat_stw
        unit_of_measurement: 'kts'
        device_class: speed
        availability: "{{ states('sensor.speed_raymarine_20_442559_pk_b941014ae3e7110c03bb1cd071a22b76_speed_water_referenced') | is_number }}"
        state: >
          {{ states('sensor.speed_raymarine_20_442559_pk_b941014ae3e7110c03bb1cd071a22b76_speed_water_referenced') | float(0) | round(1) }}

      - name: Boat Depth
        unique_id: boat_depth
        unit_of_measurement: 'm'
        availability: "{{ states('sensor.water_depth_raymarine_20_442559_pk_f84fbd9ceeb9d458972daa61e19e4acf_depth') | is_number }}"
        state: >
          {{ states('sensor.water_depth_raymarine_20_442559_pk_f84fbd9ceeb9d458972daa61e19e4acf_depth') | float(0) | round(1) }}

      # `availability` matters for every alias below: without it the `| float(0)`
      # default turns "no data on the bus" into a hard 0, and the charts then draw
      # a flat line of zeroes (and, for the position aliases, make open-meteo
      # forecast 0°N/0°E) instead of simply having a gap.
      - name: Boat Wind Speed
        unique_id: boat_wind_speed
        unit_of_measurement: 'kts'
        device_class: wind_speed
        availability: "{{ states('sensor.wind_data_raymarine_20_442559_pk_a00872849cc8b861a8f51deb51cc1cd2_wind_speed') | is_number }}"
        state: >
          {{ states('sensor.wind_data_raymarine_20_442559_pk_a00872849cc8b861a8f51deb51cc1cd2_wind_speed') | float(0) | round(1) }}

      - name: Boat Wind Angle
        unique_id: boat_wind_angle
        unit_of_measurement: '°'
        icon: mdi:compass-rose
        availability: "{{ states('sensor.wind_data_raymarine_20_442559_pk_a00872849cc8b861a8f51deb51cc1cd2_wind_angle') | is_number }}"
        state: >
          {{ states('sensor.wind_data_raymarine_20_442559_pk_a00872849cc8b861a8f51deb51cc1cd2_wind_angle') | float(0) | round(0) }}

      - name: Boat COG
        unique_id: boat_cog
        unit_of_measurement: '°'
        icon: mdi:compass-rose
        availability: "{{ states('sensor.cog_sog_rapid_update_raymarine_display_1180407_pk_3b6721c745c17891811fa7e601a6aa50_cog') | is_number }}"
        state: >
          {{ states('sensor.cog_sog_rapid_update_raymarine_display_1180407_pk_3b6721c745c17891811fa7e601a6aa50_cog') | float(0) | round(0) }}

      - name: Boat SOG
        unique_id: boat_sog
        unit_of_measurement: 'kts'
        device_class: speed
        availability: "{{ states('sensor.cog_sog_rapid_update_raymarine_display_1180407_pk_3b6721c745c17891811fa7e601a6aa50_sog') | is_number }}"
        state: >
          {{ states('sensor.cog_sog_rapid_update_raymarine_display_1180407_pk_3b6721c745c17891811fa7e601a6aa50_sog') | float(0) | round(1) }}

      - name: Boat Latitude Raw
        unique_id: boat_latitude_raw
        availability: "{{ states('sensor.position_rapid_update_raymarine_display_1180407_pk_dbdf6a933ca2a0c28e21602200f43fa1_latitude') | is_number }}"
        state: >
          {{ states('sensor.position_rapid_update_raymarine_display_1180407_pk_dbdf6a933ca2a0c28e21602200f43fa1_latitude') | float(0) }}

      - name: Boat Longitude Raw
        unique_id: boat_longitude_raw
        availability: "{{ states('sensor.position_rapid_update_raymarine_display_1180407_pk_dbdf6a933ca2a0c28e21602200f43fa1_longitude') | is_number }}"
        state: >
          {{ states('sensor.position_rapid_update_raymarine_display_1180407_pk_dbdf6a933ca2a0c28e21602200f43fa1_longitude') | float(0) }}

      - name: Boat Pressure Raw
        unique_id: boat_pressure_raw
        availability: "{{ states('sensor.environmental_parameters_raymarine_20_442559_pk_c0b9b7c9728b2e5148992f92655bbe0c_atmospheric_pressure') | is_number }}"
        state: >
          {{ states('sensor.environmental_parameters_raymarine_20_442559_pk_c0b9b7c9728b2e5148992f92655bbe0c_atmospheric_pressure') | float(0) }}

      # Plain recorder history for the wind vector chart. Reads the raw entity
      # directly (as the working version did) so it does not inherit an extra
      # template hop, and it goes unavailable instead of reporting 0° = North.
      - name: Wind Direction History
        unique_id: wind_direction_history
        unit_of_measurement: '°'
        icon: mdi:compass-rose
        availability: "{{ states('sensor.wind_data_raymarine_20_442559_pk_a00872849cc8b861a8f51deb51cc1cd2_wind_angle') | is_number }}"
        state: >
          {{ states('sensor.wind_data_raymarine_20_442559_pk_a00872849cc8b861a8f51deb51cc1cd2_wind_angle') | float(0) | round(0) }}

      - name: Barometer mmHg
        unique_id: barometer_mmhg
        unit_of_measurement: mmHg
        device_class: pressure
        state: >
          {% set p = states('sensor.boat_pressure_raw') | float(0) %}
          {{ (p * 0.750062) | round(1) if p > 200 else (p * 7.50062) | round(1) }}

      - name: Boat Latitude
        unique_id: boat_latitude
        icon: mdi:latitude
        state: >
          {% set v = states('sensor.boat_latitude_raw') | float(0) %}
          {% set d = v | abs | int %}{% set m = ((v | abs) - d) * 60 %}
          {{ d }}°{{ '%.2f' | format(m) }}'{{ 'N' if v >= 0 else 'S' }}

      - name: Boat Longitude
        unique_id: boat_longitude
        icon: mdi:longitude
        state: >
          {% set v = states('sensor.boat_longitude_raw') | float(0) %}
          {% set d = v | abs | int %}{% set m = ((v | abs) - d) * 60 %}
          {{ d }}°{{ '%.2f' | format(m) }}'{{ 'E' if v >= 0 else 'W' }}

  - device_tracker:
      - name: Nevera
        unique_id: nevera_boat_gps
        latitude: >
          {{ states('sensor.boat_latitude_raw') | float(0) }}
        longitude: >
          {{ states('sensor.boat_longitude_raw') | float(0) }}
        icon: mdi:sail-boat
