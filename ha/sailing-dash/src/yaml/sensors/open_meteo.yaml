# Open-Meteo REST platform sensors for wind and wave forecast
#
# POSITION FALLBACK — do not simplify this away. Both URLs are templated on the
# boat's own live GPS (sensor.boat_latitude_raw / boat_longitude_raw, derived
# from PGN 129025/129029) so the forecast follows the boat. Those aliases are
# template sensors, i.e. they can hold a literal 0.0 while the bus is quiet;
# `| float(42.43)` never fires for a value that IS a number, so a naive URL
# ends up asking open-meteo about 0°N/0°E — the Gulf of Guinea — and the wind
# chart then draws a plausible-looking but completely wrong forecast. Hence the
# explicit "no fix yet" check against the Kotor default below.
#
# MODEL SELECTION — the weather model is picked at runtime from the dashboard
# via input_select.forecast_wind_model / forecast_wave_model (see
# src/yaml/helpers/forecast_model.yaml). `resource_template` is re-rendered on
# every poll, so switching the model in the UI takes effect as soon as the
# refresh automation re-polls the sensor — no rebuild, no HA restart.
# `best_match` (and any unknown/unavailable helper state) must emit NO `models=`
# parameter at all: Open-Meteo then picks the best model per location itself,
# whereas `models=best_match` is not a valid model id.
rest:
  - resource_template: >-
      {%- set lat = states('sensor.boat_latitude_raw') | float(0) -%}
      {%- set lon = states('sensor.boat_longitude_raw') | float(0) -%}
      {%- if lat | abs < 0.01 and lon | abs < 0.01 -%}
      {%- set lat = 42.43 -%}{%- set lon = 18.60 -%}
      {%- endif -%}
      {%- set model = states('input_select.forecast_wind_model') -%}
      {%- if model in ['best_match', 'unknown', 'unavailable', 'none', ''] -%}
      {%- set models = '' -%}
      {%- else -%}
      {%- set models = '&models=' ~ model -%}
      {%- endif -%}
      https://api.open-meteo.com/v1/forecast?latitude={{ lat }}&longitude={{ lon }}{{ models }}&hourly=windspeed_10m,windgusts_10m,winddirection_10m&wind_speed_unit=kn&forecast_days={{ [ (((utcnow().hour + utcnow().minute / 60) + (state_attr('sensor.chart_time_window', 'forecast_hours') | int(72))) / 24) | round(0, 'ceil') | int, 16 ] | min }}&timezone=UTC
    scan_interval: 900
    sensor:
      - name: 'Wind Forecast REST'
        unique_id: wind_forecast_rest
        icon: mdi:weather-windy
        value_template: "{{ value_json.hourly.windspeed_10m | list | first | round(1) }}"
        unit_of_measurement: 'kts'
        json_attributes:
          - hourly

  - resource_template: >-
      {%- set lat = states('sensor.boat_latitude_raw') | float(0) -%}
      {%- set lon = states('sensor.boat_longitude_raw') | float(0) -%}
      {%- if lat | abs < 0.01 and lon | abs < 0.01 -%}
      {%- set lat = 42.43 -%}{%- set lon = 18.60 -%}
      {%- endif -%}
      {%- set model = states('input_select.forecast_wave_model') -%}
      {%- if model in ['best_match', 'unknown', 'unavailable', 'none', ''] -%}
      {%- set models = '' -%}
      {%- else -%}
      {%- set models = '&models=' ~ model -%}
      {%- endif -%}
      https://marine-api.open-meteo.com/v1/marine?latitude={{ lat }}&longitude={{ lon }}{{ models }}&hourly=wave_height,wave_direction,wave_period&forecast_days={{ [ (((utcnow().hour + utcnow().minute / 60) + (state_attr('sensor.chart_time_window', 'forecast_hours') | int(72))) / 24) | round(0, 'ceil') | int, 16 ] | min }}&timezone=UTC
    scan_interval: 900
    sensor:
      - name: 'Wave Forecast REST'
        unique_id: wave_forecast_rest
        icon: mdi:waves
        value_template: "{{ value_json.hourly.wave_height | list | first | round(1) }}"
        unit_of_measurement: 'm'
        json_attributes:
          - hourly
