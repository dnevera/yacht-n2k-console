- type: grid
  cards:
  - type: heading
    heading_style: title
    heading: Wind Direction & Speed
    icon: mdi:weather-windy
  - type: glance
    show_icon: false
    state_color: false
    columns: 3
    entities:
    - entity: sensor.boat_wind_speed
      name: Measured now
      card_mod:
        style: "div.name {\n  font-size: 12px !important;\n  font-weight: 400 !important;\n\
          \  line-height: 14px !important;\n  color: var(--secondary-text-color)\
          \ !important;\n}\ndiv:not(.name) {\n  font-size: 26px !important;\n  font-weight:\
          \ 500 !important;\n  line-height: 30px !important;\n  color: #4fc3f7 !important;\n\
          }\n"
    - entity: sensor.wind_forecast_next_hour
      name: Forecast next 1h
      card_mod:
        style: "div.name {\n  font-size: 12px !important;\n  font-weight: 400 !important;\n\
          \  line-height: 14px !important;\n  color: var(--secondary-text-color)\
          \ !important;\n}\ndiv:not(.name) {\n  font-size: 26px !important;\n  font-weight:\
          \ 500 !important;\n  line-height: 30px !important;\n  color: #b0bec5 !important;\n\
          }\n"
    - entity: sensor.wind_gust_next_hour
      name: Gusts next 1h
      card_mod:
        style: "div.name {\n  font-size: 12px !important;\n  font-weight: 400 !important;\n\
          \  line-height: 14px !important;\n  color: var(--secondary-text-color)\
          \ !important;\n}\ndiv:not(.name) {\n  font-size: 26px !important;\n  font-weight:\
          \ 500 !important;\n  line-height: 30px !important;\n  color: #ff7043 !important;\n\
          }\n"
    card_mod:
      style: "ha-card { padding: 10px 8px 6px !important; }\n.entities { padding:\
        \ 0 !important; }\n.entity {\n  flex-direction: column-reverse !important;\n\
        }\n"
    grid_options:
      columns: 36
  - type: custom:plotly-graph
    hours_to_show: >-
      $fn ({ hass }) => { const a = (hass.states['sensor.chart_time_window'] ||
      { attributes: {} }).attributes; return Number(a.history_hours || 4) +
      Number(a.forecast_hours || 24); }
    time_offset: >-
      $fn ({ hass }) => ((hass.states['sensor.chart_time_window'] ||
      { attributes: {} }).attributes.forecast_hours || 24) + 'h'
    entities:
    - entity: sensor.wind_direction_history
      internal: true
      filters:
      - resample: 30m
      - map_y: parseFloat(y)
      - store_var: dir
    - entity: sensor.boat_wind_speed
      name: Measured
      mode: markers
      filters:
      - resample: 30m
      - map_y: parseFloat(y)
      - store_var: speed
      customdata: "$fn ({ xs, vars }) => {\n  const points = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];\n\
        \  const dirYs = (vars.dir && vars.dir.ys) || [];\n  return xs.map((_, i)\
        \ => {\n    const d = dirYs[i] || 0;\n    return points[Math.round((((d\
        \ % 360) + 360) % 360) / 22.5) % 16] + ' ' + Math.round(d) + '°';\n  });\n\
        }"
      hovertemplate: '%{y:.1f} kt · %{customdata}<extra>Measured</extra>'
      marker:
        size: 6
        symbol: circle
        color: '#4fc3f7'
        line:
          width: 0
    - entity: sensor.wind_forecast_flat
      name: Forecast
      mode: markers
      extend_to_present: false
      filters:
      - fn: "({ meta }) => ({\n  xs: (meta.forecast_time || []).map((t) => new Date(t\
          \ + \"Z\")),\n  ys: (meta.forecast_wind || []),\n})"
      - fn: ({ meta, vars }) => { vars.forecastDir = meta.forecast_dir || []; return
          {}; }
      - store_var: forecastSpeed
      customdata: "$fn ({ meta }) => {\n  const points = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];\n\
        \  return (meta.forecast_dir || []).map((d) => points[Math.round((((d %\
        \ 360) + 360) % 360) / 22.5) % 16] + ' ' + Math.round(d) + '°');\n}"
      hovertemplate: '%{y:.1f} kt · %{customdata}<extra>Forecast</extra>'
      marker:
        size: 6
        symbol: diamond
        color: '#ff7043'
        line:
          width: 0
    - entity: sensor.boat_wind_speed
      name: kt scale
      mode: markers
      showlegend: false
      hoverinfo: skip
      extend_to_present: false
      filters:
      - resample: 30m
      - map_y: parseFloat(y)
      - fn: '() => ({ xs: [], ys: [] })'
      marker:
        size: 0.1
        opacity: 0
        color: $ex ys
        colorscale:
        - - 0
          - '#b0e2ff'
        - - 0.125
          - '#61c4e0'
        - - 0.25
          - '#4bbf7a'
        - - 0.375
          - '#a8d048'
        - - 0.5
          - '#f5e642'
        - - 0.625
          - '#f2a93b'
        - - 0.75
          - '#eb5c2a'
        - - 0.875
          - '#d62828'
        - - 1
          - '#8e1b8e'
        cmin: 0
        cmax: 40
        showscale: true
        colorbar:
          title:
            text: kt
            side: top
          ticksuffix: ' kt'
          len: 0.9
    - entity: sensor.boat_wind_speed
      name: Gusts (measured)
      mode: lines
      filters:
      - map_y: parseFloat(y)
      - fn: "({ xs, ys }) => {\n  const windowMs = 10 * 60 * 1000;\n  const outXs\
          \ = [];\n  const outYs = [];\n  let bucketStart = null;\n  let bucketMax\
          \ = null;\n  for (let i = 0; i < xs.length; i++) {\n    const t = new\
          \ Date(xs[i]).getTime();\n    if (bucketStart === null || t - bucketStart\
          \ >= windowMs) {\n      if (bucketStart !== null) { outXs.push(new Date(bucketStart\
          \ + windowMs)); outYs.push(bucketMax); }\n      bucketStart = t;\n   \
          \   bucketMax = ys[i];\n    } else if (ys[i] > bucketMax) {\n      bucketMax\
          \ = ys[i];\n    }\n  }\n  if (bucketStart !== null) { outXs.push(new Date(bucketStart\
          \ + windowMs)); outYs.push(bucketMax); }\n  return { xs: outXs, ys: outYs\
          \ };\n}"
      hovertemplate: '%{y:.1f} kt<extra>Gusts (measured)</extra>'
      line:
        dash: dot
        width: 1
        color: '#b0bec5'
    - entity: sensor.wind_forecast_flat
      name: Gusts (forecast)
      mode: lines
      extend_to_present: false
      filters:
      - fn: "({ meta }) => ({\n  xs: (meta.forecast_time || []).map((t) => new Date(t\
          \ + \"Z\")),\n  ys: (meta.forecast_gust || []),\n})"
      hovertemplate: '%{y:.1f} kt<extra>Gusts (forecast)</extra>'
      line:
        dash: dot
        width: 1
        color: '#78909c'
    on_dblclick: "$include:plotly_reset_on_dblclick"
    config:
      scrollZoom: false
      displayModeBar: false
      doubleClick: false
    layout:
      dragmode: pan
      hovermode: x unified
      hoverdistance: -1
      xaxis:
        showspikes: true
        spikemode: across
        spikedash: dash
        spikethickness: 1
        spikecolor: '#90a4ae'
        spikesnap: cursor
      yaxis:
        title: Wind speed (kts)
        rangemode: tozero
        autorange: true
        fixedrange: true
        showspikes: false
      legend:
        orientation: h
        x: 0.5
        xanchor: center
        y: -0.3
      margin:
        b: 70
      annotations: "$fn ({ vars }) => {\n  const walk = (root) => {\n    root.querySelectorAll('plotly-graph').forEach((el)\
        \ => {\n      const sr = el.shadowRoot;\n      if (!sr || sr.querySelector('style[data-now-radius]'))\
        \ return;\n      const st = document.createElement('style');\n      st.setAttribute('data-now-radius',\
        \ '');\n      st.textContent = '.annotation rect.bg { rx: 4px; ry: 4px;\
        \ }';\n      sr.appendChild(st);\n    });\n    root.querySelectorAll('*').forEach((el)\
        \ => { if (el.shadowRoot) walk(el.shadowRoot); });\n  };\n  try { walk(document);\
        \ } catch (e) {}\n  const windSpeedColor = (v) => {\n    const stops = [[5,'#b0e2ff'],[10,'#61c4e0'],[15,'#4bbf7a'],[20,'#a8d048'],[25,'#f5e642'],[30,'#f2a93b'],[35,'#eb5c2a'],[40,'#d62828']];\n\
        \    for (const [max, color] of stops) if (v < max) return color;\n    return\
        \ '#8e1b8e';\n  };\n  const compassPoint = (d) => {\n    const points =\
        \ ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];\n\
        \    return points[Math.round((((d % 360) + 360) % 360) / 22.5) % 16];\n\
        \  };\n  const toArrows = (xs, ys, dirs) => (xs || []).map((x, i) => {\n\
        \    const d = dirs[i] || 0;\n    const rad = ((d + 180) * Math.PI) / 180;\n\
        \    const len = 10 + (ys[i] || 0);\n    return {\n      x, y: ys[i], xref:\
        \ 'x', yref: 'y',\n      ax: -len * Math.sin(rad), ay: len * Math.cos(rad),\
        \ axref: 'pixel', ayref: 'pixel',\n      showarrow: true, arrowhead: 2,\
        \ arrowsize: 1, arrowwidth: 1.5, arrowcolor: windSpeedColor(ys[i] || 0),\n\
        \      captureevents: false,\n    };\n  });\n  const arrows = [\n    ...toArrows(vars.speed.xs,\
        \ vars.speed.ys, vars.dir.ys),\n    ...toArrows(vars.forecastSpeed.xs, vars.forecastSpeed.ys,\
        \ vars.forecastDir),\n  ];\n  return [\n    ...arrows,\n    { xref: 'x',\
        \ yref: 'paper', x: new Date(), y: 0.99, yanchor: 'top', xanchor: 'right',\
        \ text: 'Now', textangle: -90, showarrow: false, xshift: -2, bgcolor: '#ffffff',\
        \ borderpad: 4, font: { color: '#000000', size: 10 } },\n    { xref: 'paper',\
        \ yref: 'paper', x: 0.01, y: 0.97, xanchor: 'left', yanchor: 'top', text:\
        \ '▲ N &nbsp;&nbsp; ▼ S', showarrow: false, font: { color: '#90a4ae', size:\
        \ 10 } },\n  ];\n}"
      shapes: "$include:plotly_touch_patch_shapes"
    grid_options:
      columns: 36
  column_span: 3
