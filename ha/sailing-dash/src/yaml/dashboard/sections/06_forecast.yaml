- type: grid
  cards:
  - type: heading
    icon: mdi:weather-windy-variant
    heading_style: title
    heading: Forecast
  - id: windy_map
    type: custom:windy-boat-card
    lat_entity: sensor.boat_latitude_raw
    lon_entity: sensor.boat_longitude_raw
    fallback_lat: 42.43
    fallback_lon: 18.6
    zoom: 8
    overlay: wind
    product: ecmwf
    aspect_ratio: 50%
    grid_options:
      rows: 7
      columns: 36
  column_span: 3
