- type: grid
  cards:
  - type: heading
    heading_style: title
    heading: Waves
    icon: mdi:wave
  - id: glance
    type: glance
    show_icon: false
    state_color: false
    columns: 2
    entities:
    - entity: sensor.wave_height_next_hour
      name: Height next 1h
      card_mod:
        style: "div.name {\n  font-size: 12px !important;\n  font-weight: 400 !important;\n\
          \  line-height: 14px !important;\n  color: var(--secondary-text-color)\
          \ !important;\n}\ndiv:not(.name) {\n  font-size: 26px !important;\n  font-weight:\
          \ 500 !important;\n  line-height: 30px !important;\n  color: #4fc3f7 !important;\n\
          }\n"
    - entity: sensor.wave_period_next_hour
      name: Period next 1h
      card_mod:
        style: "div.name {\n  font-size: 12px !important;\n  font-weight: 400 !important;\n\
          \  line-height: 14px !important;\n  color: var(--secondary-text-color)\
          \ !important;\n}\ndiv:not(.name) {\n  font-size: 26px !important;\n  font-weight:\
          \ 500 !important;\n  line-height: 30px !important;\n  color: #b0bec5 !important;\n\
          }\n"
    card_mod:
      style: "ha-card { padding: 10px 8px 6px !important; }\n.entities { padding:\
        \ 0 !important; }\n.entity {\n  flex-direction: column-reverse !important;\n\
        }\n"
    grid_options:
      columns: 36
  - id: chart
    type: custom:plotly-graph
    hours_to_show: 76
    time_offset: 72h
    entities:
    - entity: sensor.wave_forecast_flat
      name: Wave height (forecast)
      mode: markers
      extend_to_present: false
      filters:
      - fn: "({ meta }) => ({\n  xs: (meta.forecast_time || []).map((t) => new Date(t\
          \ + \"Z\")),\n  ys: (meta.wave_height || []),\n})"
      - fn: ({ meta, vars }) => { vars.waveDir = meta.wave_direction || []; vars.wavePeriod
          = meta.wave_period || []; return {}; }
      - store_var: waveHeight
      customdata: "$fn ({ meta }) => {\n  const points = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];\n\
        \  const dirs = meta.wave_direction || [];\n  const periods = meta.wave_period\
        \ || [];\n  return dirs.map((d, i) => points[Math.round((((d % 360) + 360)\
        \ % 360) / 22.5) % 16] + ' ' + Math.round(d) + '° · ' + (periods[i] != null\
        \ ? Math.round(periods[i] * 10) / 10 + ' s' : '– s'));\n}"
      hovertemplate: '%{y:.2f} m · %{customdata}<extra>Wave (forecast)</extra>'
      marker:
        size: 6
        symbol: diamond
        color: '#4fc3f7'
        line:
          width: 0
    - entity: sensor.wave_forecast_flat
      name: Period (s)
      mode: lines
      extend_to_present: false
      visible: legendonly
      filters:
      - fn: "({ meta }) => ({\n  xs: (meta.forecast_time || []).map((t) => new Date(t\
          \ + \"Z\")),\n  ys: (meta.wave_period || []),\n})"
      hovertemplate: '%{y:.1f} s<extra>Period</extra>'
      line:
        dash: dot
        width: 1
        color: '#b0bec5'
    on_dblclick: "$include:plotly_reset_on_dblclick"
    config:
      scrollZoom: false
      displayModeBar: false
      doubleClick: false
    layout:
      dragmode: pan
      hovermode: x unified
      hoverdistance: -1
      xaxis:
        showspikes: true
        spikemode: across
        spikedash: dash
        spikethickness: 1
        spikecolor: '#90a4ae'
        spikesnap: cursor
      yaxis:
        title: Wave height (m)
        rangemode: tozero
        autorange: true
        fixedrange: true
        showspikes: false
      legend:
        orientation: h
        x: 0.5
        xanchor: center
        y: -0.3
      margin:
        b: 70
      annotations: "$fn ({ vars }) => {\n  const walk = (root) => {\n    root.querySelectorAll('plotly-graph').forEach((el)\
        \ => {\n      const sr = el.shadowRoot;\n      if (!sr || sr.querySelector('style[data-now-radius]'))\
        \ return;\n      const st = document.createElement('style');\n      st.setAttribute('data-now-radius',\
        \ '');\n      st.textContent = '.annotation rect.bg { rx: 4px; ry: 4px;\
        \ }';\n      sr.appendChild(st);\n    });\n    root.querySelectorAll('*').forEach((el)\
        \ => { if (el.shadowRoot) walk(el.shadowRoot); });\n  };\n  try { walk(document);\
        \ } catch (e) {}\n  const waveHeightColor = (v) => {\n    const stops = [[0.3,'#b0e2ff'],[0.6,'#61c4e0'],[1,'#4bbf7a'],[1.5,'#a8d048'],[2,'#f5e642'],[3,'#f2a93b'],[4,'#eb5c2a'],[5,'#d62828']];\n\
        \    for (const [max, color] of stops) if (v < max) return color;\n    return\
        \ '#8e1b8e';\n  };\n  const toArrows = (xs, ys, dirs) => (xs || []).map((x,\
        \ i) => {\n    const d = dirs[i] || 0;\n    const rad = ((d + 180) * Math.PI)\
        \ / 180;\n    const len = 14;\n    return {\n      x, y: ys[i], xref: 'x',\
        \ yref: 'y',\n      ax: -len * Math.sin(rad), ay: len * Math.cos(rad), axref:\
        \ 'pixel', ayref: 'pixel',\n      showarrow: true, arrowhead: 2, arrowsize:\
        \ 1, arrowwidth: 1.5, arrowcolor: waveHeightColor(ys[i] || 0),\n      captureevents:\
        \ false,\n    };\n  });\n  const wh = vars.waveHeight || { xs: [], ys: []\
        \ };\n  return [\n    ...toArrows(wh.xs, wh.ys, vars.waveDir || []),\n  \
        \  { xref: 'x', yref: 'paper', x: new Date(), y: 0.99, yanchor: 'top', xanchor:\
        \ 'right', text: 'Now', textangle: -90, showarrow: false, xshift: -2, bgcolor:\
        \ '#ffffff', borderpad: 4, font: { color: '#000000', size: 10 } },\n    {\
        \ xref: 'paper', yref: 'paper', x: 0.01, y: 0.97, xanchor: 'left', yanchor:\
        \ 'top', text: '▲ N &nbsp;&nbsp; ▼ S', showarrow: false, font: { color: '#90a4ae',\
        \ size: 10 } },\n  ];\n}"
      shapes: "$include:plotly_touch_patch_shapes"
    grid_options:
      columns: 36
  column_span: 3
