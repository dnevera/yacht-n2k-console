# automations-sailing.yaml — merged into the live HA /config/automations.yaml
# by deploy_sensors.sh (matched by `id`, so re-running updates in place).
#
# WHY THIS EXISTS
#   Both open-meteo `rest:` requests in sensors-sailing.yaml build their
#   `forecast_days` from sensor.chart_time_window (the single place where the
#   4h-back / 72h-ahead window is configured). At HA startup the `rest:`
#   platform performs its FIRST poll before the `template:` sensor exists, so
#   the URL falls back to `| int(48)` and the charts only get ~2 days of
#   forecast — visibly "cut off" on the right until the next 15-minute poll.
#   This automation re-polls both REST sensors right after startup (and again
#   whenever the window setting itself changes), which removes that window of
#   wrong data.
- id: sailing_forecast_refresh_on_start
  alias: Sailing — refresh open-meteo forecast after start / window change
  description: >-
    Re-polls the wind + wave open-meteo REST sensors once sensor.chart_time_window
    is available, so forecast_days matches the configured forecast_hours instead
    of the startup fallback.
  mode: single
  trigger:
    - platform: homeassistant
      event: start
    - platform: state
      entity_id: sensor.chart_time_window
  condition: []
  action:
    # Give the template platform a moment to publish chart_time_window.
    - delay: '00:00:30'
    - service: homeassistant.update_entity
      target:
        entity_id:
          - sensor.wind_forecast_rest
          - sensor.wave_forecast_rest
