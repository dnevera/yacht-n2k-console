# Sailing dashboard (Lovelace "sections" view) for Home Assistant.
#
# Extracted from the live HA instance's storage config on 2026-08-09:
#   .storage/lovelace.dashboard_sailing  (dashboard url_path: dashboard-sailing)
# Re-synced 2026-08-09 (multiple times same day) after the user rearranged
# tiles via the HA UI directly. LATEST re-sync (2026-08-09, ~13:40): right
# after a deploy from this file, the user manually replaced the wind
# `custom:compass-card` at the top of "Wind & Forecast" with the
# `custom:windrose-card` (which used to live in its own separate "Wind
# Direction — History (rose)" subsection further down) and deleted that
# now-redundant subsection/heading — the wind compass card is GONE, there is
# now a single `custom:windrose-card` at the top of the section instead. This
# file was pulled from `.storage` again to pick that up — DO NOT reintroduce
# the wind `custom:compass-card` or the separate rose subsection on the next
# edit without checking the live config first (see rule below).
#
# ⚠️ RULE (added 2026-08-09 after this got violated): before editing this file
# and running deploy_dashboard.sh, ALWAYS pull+diff the live `.storage` config
# first (`deploy_dashboard.sh` does this automatically via its pre-deploy
# diff, but do it manually too when investigating) — the user edits this
# dashboard directly in the HA UI often, and a blind edit-then-deploy will
# silently discard those changes.
#
# This is the single source of truth going forward — edit THIS file, then
# redeploy with deploy_dashboard.sh (round-trips it back into .storage on the
# target host, since HA storage-mode dashboards are not editable as plain
# files on disk without re-registering them).
#
# Requires HACS/manual custom cards (already installed on bumblebee, not
# managed here):
#   - custom:compass-card    (lovelace-compass-card, still used for COG in Position)
#   - custom:windrose-card   (lovelace-windrose-card, manually installed, see README)
#   - custom:apexcharts-card (lovelace-card-templater / apexcharts-card)
#   - custom:card-mod        (lovelace-card-mod, used by the Windy tap overlay)
#
# Entities referenced (all published by ydnu02-tcp-gateway via NMEA2000 -> HA,
# except device_tracker.nevera, which is a `template: device_tracker` derived
# from the boat's own N2K GPS position (PGN 129025/129029, Raymarine display),
# NOT the phone's GPS (device_tracker.iphone_17_promax_nevera is available but
# intentionally not used here — it tracks the crew member's phone, not the
# boat), and sensor.wind_forecast_flat which comes from an external forecast
# integration, attrs: forecast_time/forecast_wind/forecast_gust):
#   sensor.cog_sog_rapid_update_raymarine_display_*_cog / _sog   (PGN 129026)
#   sensor.wind_data_raymarine_20_*_wind_angle / _wind_speed     (PGN 130306)
#   sensor.speed_raymarine_20_*_speed_water_referenced           (PGN 128259)
#   sensor.water_depth_raymarine_20_*_depth                      (PGN 128267)
#   sensor.boat_latitude / sensor.boat_longitude / sensor.barometer_mmhg
views:
- type: sections
  title: Sailing
  icon: mdi:sail-boat
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Wind & Forecast
      heading_style: title
    - type: custom:windrose-card
      windspeed_bar_location: right
      data_period:
        period_back: -24h
      wind_direction_entity:
        entity: sensor.wind_direction_history
      windspeed_entities:
      - entity: sensor.wind_data_raymarine_20_442559_pk_a00872849cc8b861a8f51deb51cc1cd2_wind_speed
        name: Speed
      current_direction:
        show_arrow: true
      corner_info:
        top_right:
          label: Wind Speed
          unit: ' kn'
          entity: sensor.wind_data_raymarine_20_442559_pk_a00872849cc8b861a8f51deb51cc1cd2_wind_speed
    - type: custom:apexcharts-card
      cache: false
      graph_span: 26h
      span:
        start: minute
        offset: -2h
      now:
        show: true
        label: Now
        color: '#ffffff'
      header:
        show: true
        title: Wind — History & Forecast
        show_states: true
        colorize_states: true
      apex_config:
        chart:
          height: 300
          width: 600
        legend:
          position: bottom
        yaxis:
          min: 0
          decimalsInFloat: 1
      series:
      - entity: sensor.wind_data_raymarine_20_442559_pk_a00872849cc8b861a8f51deb51cc1cd2_wind_speed
        name: Measured (kts)
        type: area
        color: '#00bcd4'
        stroke_width: 2
        fill_raw: 'null'
        unit: kts
        show:
          extremas: true
      - entity: sensor.wind_forecast_flat
        name: Forecast (kts)
        type: line
        color: '#4fc3f7'
        stroke_width: 2
        stroke_dash: 5
        unit: kts
        data_generator: const times=entity.attributes.forecast_time||[];const speeds=entity.attributes.forecast_wind||[];const rangeStart=Date.now()-2*3600000;return times.map((t,i)=>[new Date(t+"Z").getTime(),Math.round(speeds[i]*10)/10]).filter(p=>p[0]>=rangeStart);
      - entity: sensor.wind_forecast_flat
        name: Gusts (kts)
        type: line
        color: '#ff7043'
        stroke_width: 1
        stroke_dash: 4
        unit: kts
        opacity: 0.9
        data_generator: const times=entity.attributes.forecast_time||[];const gusts=entity.attributes.forecast_gust||[];const rangeStart=Date.now()-2*3600000;return times.map((t,i)=>[new Date(t+"Z").getTime(),Math.round(gusts[i]*10)/10]).filter(p=>p[0]>=rangeStart);
    - type: heading
      heading: Wind Direction & Speed — Vector Chart
      heading_style: subtitle
  - type: grid
    cards:
    - type: heading
      heading: Weather & Forecast
      heading_style: title
    - type: grid
      columns: 1
      card_mod:
        style: ".card {\n  display: grid;\n}\n.card > * {\n  grid-column: 1;\n  grid-row: 1;\n}\n"
      cards:
      - type: iframe
        url: https://embed.windy.com/embed2.html?lat=42.43&lon=18.60&detailLat=42.43&detailLon=18.60&width=650&height=450&zoom=8&level=surface&overlay=wind&product=ecmwf&menu=&message=true&marker=true&calendar=now&pressure=&type=map&location=coordinates&detail=true&metricWind=kt&metricTemp=%C2%B0C&radarRange=-1
        aspect_ratio: 65%
      - type: button
        show_name: false
        show_icon: false
        tap_action:
          action: url
          url_path: https://www.windy.com/42.43/18.60?wind,42.43,18.60,i:pressure
        card_mod:
          style: "ha-card {\n  position: absolute;\n  inset: 0;\n  margin: 0;\n  background: transparent;\n  box-shadow: none;\n  border: none;\n  cursor: pointer;\n}\n"
      grid_options:
        rows: 6
        columns: 12
    - type: gauge
      name: Pressure (mmHg)
      entity: sensor.barometer_mmhg
      min: 720
      max: 790
      needle: true
      severity:
        red: 720
        yellow: 745
        green: 760
      grid_options:
        rows: 3
        columns: 12
    - type: tile
      entity: sensor.barometer_mmhg
      features:
      - type: trend-graph
      grid_options:
        columns: 12
        rows: 2
  - type: grid
    cards:
    - type: heading
      heading: Position
    - type: custom:compass-card
      header:
        title:
          value: COG
        icon:
          value: mdi:compass-outline
      compass:
        circle:
          color: '#37474f'
        ticks:
          show: true
          color: '#90a4ae'
          radius: 52
        north:
          show: true
        east:
          show: true
        south:
          show: true
        west:
          show: true
      indicator_sensors:
      - sensor: sensor.cog_sog_rapid_update_raymarine_display_1180407_pk_3b6721c745c17891811fa7e601a6aa50_cog
        indicator:
          image: arrow_inward
          color: '#ff7043'
      value_sensors:
      - sensor: sensor.cog_sog_rapid_update_raymarine_display_1180407_pk_3b6721c745c17891811fa7e601a6aa50_cog
    - type: map
      entities:
      - entity: device_tracker.nevera
      default_zoom: 14
      aspect_ratio: 16x9
    - type: entity
      entity: sensor.boat_latitude
      name: Latitude
    - type: entity
      entity: sensor.boat_longitude
      name: Longitude
  - type: grid
    cards:
    - type: heading
      heading_style: title
      heading: Wind Direction & Speed
    - type: custom:plotly-graph
      hours_to_show: 30
      entities:
      - entity: sensor.wind_direction_history
        internal: true
        filters:
        - resample: 30m
        - map_y: parseFloat(y)
        - store_var: dir
      - entity: sensor.wind_data_raymarine_20_442559_pk_a00872849cc8b861a8f51deb51cc1cd2_wind_speed
        name: Measured
        mode: markers
        filters:
        - resample: 30m
        - map_y: parseFloat(y)
        - store_var: speed
        marker:
          size: 5
          color: $ex ys
          colorscale:
          - - 0
            - '#b0e2ff'
          - - 0.125
            - '#61c4e0'
          - - 0.25
            - '#4bbf7a'
          - - 0.375
            - '#a8d048'
          - - 0.5
            - '#f5e642'
          - - 0.625
            - '#f2a93b'
          - - 0.75
            - '#eb5c2a'
          - - 0.875
            - '#d62828'
          - - 1
            - '#8e1b8e'
          cmin: 0
          cmax: 40
          showscale: true
          colorbar:
            title:
              text: kt
              side: top
            ticksuffix: ' kt'
            len: 0.9
      - entity: sensor.wind_forecast_flat
        name: Forecast
        mode: markers
        extend_to_present: false
        filters:
        - fn: "({ meta }) => ({\n  xs: (meta.forecast_time || []).map((t) => new Date(t + \"Z\")),\n  ys: (meta.forecast_wind || []),\n})"
        - fn: ({ meta, vars }) => { vars.forecastDir = meta.forecast_dir || []; return {}; }
        - store_var: forecastSpeed
        marker:
          size: 5
          color: $ex ys
          colorscale:
          - - 0
            - '#b0e2ff'
          - - 0.125
            - '#61c4e0'
          - - 0.25
            - '#4bbf7a'
          - - 0.375
            - '#a8d048'
          - - 0.5
            - '#f5e642'
          - - 0.625
            - '#f2a93b'
          - - 0.75
            - '#eb5c2a'
          - - 0.875
            - '#d62828'
          - - 1
            - '#8e1b8e'
          cmin: 0
          cmax: 40
      layout:
        yaxis:
          title: Wind speed (kts)
          rangemode: tozero
        xaxis:
          range: $fn () => [new Date(Date.now() - 2 * 3600000), new Date(Date.now() + 24 * 3600000)]
        legend:
          orientation: h
          x: 0.5
          xanchor: center
          y: -0.3
        margin:
          b: 70
        annotations: "$fn ({ vars }) => {\n  const windSpeedColor = (v) => {\n    const stops = [[5,'#b0e2ff'],[10,'#61c4e0'],[15,'#4bbf7a'],[20,'#a8d048'],[25,'#f5e642'],[30,'#f2a93b'],[35,'#eb5c2a'],[40,'#d62828']];\n    for (const [max, color] of stops) if (v < max) return color;\n    return '#8e1b8e';\n  };\n  const compassPoint = (d) => {\n    const points = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];\n    return points[Math.round((((d % 360) + 360) % 360) / 22.5) % 16];\n  };\n  const toArrows = (xs, ys, dirs) => (xs || []).map((x, i) => {\n    const d = dirs[i] || 0;\n    const rad = ((d + 180) * Math.PI) / 180;\n    const len = 10 + (ys[i] || 0);\n    return {\n      x, y: ys[i], xref: 'x', yref: 'y',\n      ax: -len * Math.sin(rad), ay: len * Math.cos(rad), axref: 'pixel', ayref: 'pixel',\n      showarrow: true, arrowhead: 2, arrowsize: 1, arrowwidth: 1.5, arrowcolor: windSpeedColor(ys[i] || 0),\n      captureevents: true, hovertext: compassPoint(d) + ' ' + Math.round(d) + '\u00b0',\n      hoverlabel: { bgcolor: windSpeedColor(ys[i] || 0), font: { color: '#111111' } },\n    };\n  });\n  const arrows = [\n    ...toArrows(vars.speed.xs, vars.speed.ys, vars.dir.ys),\n    ...toArrows(vars.forecastSpeed.xs, vars.forecastSpeed.ys, vars.forecastDir),\n  ];\n  return [\n    ...arrows,\n    { xref: 'x', yref: 'paper', x: new Date(), y: 1, yanchor: 'bottom',\
          \ text: 'Now', showarrow: false, font: { color: '#ffffff', size: 10 } },\n    { xref: 'paper', yref: 'paper', x: 0, y: 1, xanchor: 'left', yanchor: 'bottom', text: '▲ N &nbsp;&nbsp; ▼ S', showarrow: false, font: { color: '#90a4ae', size: 10 } },\n  ];\n}"
        shapes: '$fn () => [{ type: "line", xref: "x", yref: "paper", x0: new Date(), x1: new Date(), y0: 0, y1: 1, line: { color: "#ffffff", width: 1, dash: "dot" } }]'
      grid_options:
        columns: 12
    column_span: 3
  - type: grid
    cards:
    - type: heading
      heading: Speed & Depth
    - type: gauge
      name: SOG (kn)
      entity: sensor.cog_sog_rapid_update_raymarine_display_1180407_pk_3b6721c745c17891811fa7e601a6aa50_sog
      min: 0
      max: 12
      needle: true
      severity:
        green: 0
        yellow: 8
        red: 10
  - type: grid
    cards:
    - type: heading
      heading: New section
    - type: gauge
      name: STW (kn)
      entity: sensor.speed_raymarine_20_442559_pk_b941014ae3e7110c03bb1cd071a22b76_speed_water_referenced
      min: 0
      max: 12
      needle: true
      severity:
        green: 0
        yellow: 8
        red: 10
  - type: grid
    cards:
    - type: heading
      heading: New section
    - type: gauge
      name: Depth (m)
      entity: sensor.water_depth_raymarine_20_442559_pk_f84fbd9ceeb9d458972daa61e19e4acf_depth
      min: 0
      max: 30
      needle: true
      severity:
        red: 0
        yellow: 3
        green: 5
