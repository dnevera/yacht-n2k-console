# Sailing dashboard (Lovelace "sections" view) for Home Assistant.
#
# Extracted from the live HA instance's storage config on 2026-08-09:
#   .storage/lovelace.dashboard_sailing  (dashboard url_path: dashboard-sailing)
# Re-synced 2026-08-09 (later same day, twice) after the user rearranged
# tiles via the HA UI directly — this file was regenerated from the live
# storage config each time to pick up the newest layout: headings renamed
# ("Wind & Forecast" / "Weather & Forecast", heading_style: title), the
# Windy grid/pressure gauge/pressure trend-graph tile now share the second
# section, and the COG compass moved again into the "Position" section.
#
# This is the single source of truth going forward — edit THIS file, then
# redeploy with deploy_dashboard.sh (round-trips it back into .storage on the
# target host, since HA storage-mode dashboards are not editable as plain
# files on disk without re-registering them).
#
# Requires HACS custom cards (already installed on bumblebee, not managed here):
#   - custom:compass-card    (lovelace-compass-card)
#   - custom:apexcharts-card (lovelace-card-templater / apexcharts-card)
#   - custom:card-mod        (lovelace-card-mod, used by the Windy tap overlay)
#
# Entities referenced (all published by ydnu02-tcp-gateway via NMEA2000 -> HA,
# except device_tracker.nevera, which is a `template: device_tracker` derived
# from the boat's own N2K GPS position (PGN 129025/129029, Raymarine display),
# NOT the phone's GPS (device_tracker.iphone_17_promax_nevera is available but
# intentionally not used here — it tracks the crew member's phone, not the
# boat), and sensor.wind_forecast_flat which comes from an external forecast
# integration, attrs: forecast_time/forecast_wind/forecast_gust):
#   sensor.cog_sog_rapid_update_raymarine_display_*_cog / _sog   (PGN 129026)
#   sensor.wind_data_raymarine_20_*_wind_angle / _wind_speed     (PGN 130306)
#   sensor.speed_raymarine_20_*_speed_water_referenced           (PGN 128259)
#   sensor.water_depth_raymarine_20_*_depth                      (PGN 128267)
#   sensor.boat_latitude / sensor.boat_longitude / sensor.barometer_mmhg
#
views:
- type: sections
  title: Sailing
  icon: mdi:sail-boat
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Wind & Forecast
      heading_style: title
    - type: custom:compass-card
      header:
        title:
          value: Wind
        icon:
          value: mdi:weather-windy
      compass:
        circle:
          color: '#37474f'
        ticks:
          show: true
          color: '#90a4ae'
          radius: 52
        north:
          show: true
        east:
          show: true
        south:
          show: true
        west:
          show: true
      indicator_sensors:
      - sensor: sensor.wind_data_raymarine_20_442559_pk_a00872849cc8b861a8f51deb51cc1cd2_wind_angle
        indicator:
          image: arrow_inward
          color: '#4fc3f7'
      value_sensors:
      - sensor: sensor.wind_data_raymarine_20_442559_pk_a00872849cc8b861a8f51deb51cc1cd2_wind_speed
    - type: custom:apexcharts-card
      cache: false
      graph_span: 30h
      span:
        start: hour
        offset: -6h
      now:
        show: true
        label: Now
        color: '#ffffff'
      header:
        show: true
        title: Wind — History & Forecast
        show_states: true
        colorize_states: true
      apex_config:
        chart:
          height: 300
          width: 600
        legend:
          position: bottom
        yaxis:
          min: 0
          decimalsInFloat: 1
      series:
      - entity: sensor.wind_data_raymarine_20_442559_pk_a00872849cc8b861a8f51deb51cc1cd2_wind_speed
        name: Measured (kts)
        type: area
        color: '#00bcd4'
        stroke_width: 2
        fill_raw: 'null'
        unit: kts
        show:
          extremas: true
      - entity: sensor.wind_forecast_flat
        name: Forecast (kts)
        type: line
        color: '#4fc3f7'
        stroke_width: 2
        stroke_dash: 5
        unit: kts
        data_generator: const times=entity.attributes.forecast_time||[];const speeds=entity.attributes.forecast_wind||[];const
          rangeStart=Date.now()-6*3600000;return times.map((t,i)=>[new Date(t+"Z").getTime(),Math.round(speeds[i]*10)/10]).filter(p=>p[0]>=rangeStart);
      - entity: sensor.wind_forecast_flat
        name: Gusts (kts)
        type: line
        color: '#ff7043'
        stroke_width: 1
        stroke_dash: 4
        unit: kts
        opacity: 0.9
        data_generator: const times=entity.attributes.forecast_time||[];const gusts=entity.attributes.forecast_gust||[];const
          rangeStart=Date.now()-6*3600000;return times.map((t,i)=>[new Date(t+"Z").getTime(),Math.round(gusts[i]*10)/10]).filter(p=>p[0]>=rangeStart);
    # Wind DIRECTION — rewritten again 2026-08-09 v3, per explicit user
    # request for a genuine windrose visualization instead of a chart/tile
    # hack. Two parts now:
    #  1. HISTORY — a real `custom:windrose-card`
    #     (github.com/aukedejong/lovelace-windrose-card, v2.4.2), manually
    #     downloaded to /config/www/windrose-card.js and registered as a
    #     lovelace resource (NOT installed via HACS — this repo isn't the
    #     same as the 3 cards in requirements-ha.txt, see README for the
    #     manual-install steps used) — plots the real polar distribution of
    #     measured wind direction/speed over the last 24h from actual
    #     recorder history (sensor.wind_direction_history + the raw
    #     Raymarine wind speed sensor), with a red arrow for the current
    #     direction. This is what the card is designed for.
    #  2. FORECAST — open-meteo's forecast_dir/forecast_wind are a
    #     fixed-length ARRAY on one sensor's attributes, not per-hour
    #     recorder history — windrose-card (like apexcharts-card/
    #     compass-card) has no way to plot that. Kept as a compact row of
    #     small (22px, not oversized) rotated `mdi:navigation` arrow tiles
    #     below, one per forecast hour (+0h..+21h from now).
    - type: heading
      heading: Wind Direction — History (rose)
      heading_style: subtitle
    - type: custom:windrose-card
      windspeed_bar_location: right
      data_period:
        period_back: -24h
      wind_direction_entity:
        entity: sensor.wind_direction_history
      windspeed_entities:
      - entity: sensor.wind_data_raymarine_20_442559_pk_a00872849cc8b861a8f51deb51cc1cd2_wind_speed
        name: Speed
      current_direction:
        show_arrow: true
      # Wind speed is already encoded in the rose itself (petal color by
      # speed bucket via windspeed_entities + the scale bar on the right),
      # this just adds an explicit numeric read-out of the current speed on
      # top of that, so both the visual and the exact number are available.
      corner_info:
        top_right:
          label: Wind Speed
          unit: ' kn'
          entity: sensor.wind_data_raymarine_20_442559_pk_a00872849cc8b861a8f51deb51cc1cd2_wind_speed
    - type: heading
      heading: Wind Direction Forecast (next 21h)
      heading_style: subtitle
    - type: grid
      columns: 8
      square: false
      cards:
      - type: tile
        entity: sensor.wind_forecast_flat
        name: '+0h'
        icon: mdi:navigation
        show_state: true
        state_content: last_changed
        card_mod:
          style: |
            {% set times = state_attr('sensor.wind_forecast_flat','forecast_time') or [] %}
            {% set dirs = state_attr('sensor.wind_forecast_flat','forecast_dir') or [] %}
            {% set now_iso = utcnow().strftime('%Y-%m-%dT%H:00') %}
            {% set base = times.index(now_iso) if now_iso in times else 0 %}
            {% set idx = base + 0 %}
            {% set deg = dirs[idx] if idx < dirs|length else (dirs[-1] if dirs else 0) %}
            ha-card {
              --tile-icon-size: 22px;
            }
            ha-state-icon {
              transform: rotate({{ deg }}deg);
            }
            .primary {
              content: "{{ deg | round(0) }}°";
            }
      - type: tile
        entity: sensor.wind_forecast_flat
        name: '+3h'
        icon: mdi:navigation
        show_state: true
        state_content: last_changed
        card_mod:
          style: |
