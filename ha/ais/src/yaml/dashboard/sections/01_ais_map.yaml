- type: vertical-stack
  # This is the SINGLE top-level card the `panel` view renders — it stretches
  # edge-to-edge (see header.yaml), and everything below stacks inside it.
  cards:
    - type: heading
      heading: AIS
    - id: map
      type: map
      # Own boat (GPS pin) + every live AIS target. The targets come from the
      # `ais_targets` custom integration's geo_location source (it reads the
      # gateway directly — the nmea2000 HA integration is NOT involved in AIS).
      entities:
        - entity: device_tracker.nevera
      geo_location_sources:
        - ais_targets
      default_zoom: 12
      # Fixed height via card-mod so the map doesn't also stretch to fill the
      # whole panel view's height (only the WIDTH should be edge-to-edge).
      # helpers/build.py refreshes default_zoom and the pixel height from
      # config.yaml at build time.
      card_mod:
        style: |
          ha-card { height: 480px; }
          #map { height: 480px !important; }
    - id: detail_list
      type: custom:auto-entities
      # auto-entities discovers the changing set of geo_location.ais_* entities
      # at runtime (the vessel list is never known at build time) and feeds them
      # to flex-table-card, which renders one row per vessel with one COLUMN PER
      # FIELD and makes every row clickable (opens the vessel's more-info dialog
      # with its mini-map — i.e. "focus this target on the map").
      # helpers/build.py overwrites `card.columns` from config.yaml's
      # detail_fields; the list below is only the as-shipped default so this
      # file stays valid on its own.
      card:
        type: custom:flex-table-card
        title: AIS Targets
        clickable: true
        sort_by: name+
        columns:
          - name: Vessel
            data: name
          - name: MMSI
            data: mmsi
          - name: Name
            data: vessel_name
          - name: Callsign
            data: callsign
          - name: Type
            data: ship_type
          - name: Length (m)
            data: length
          - name: Beam (m)
            data: beam
          - name: Destination
            data: destination
          - name: SOG (kn)
            data: sog
          - name: COG (°)
            data: cog
          - name: Heading (°)
            data: heading
          - name: Nav Status
            data: nav_status
          - name: Last Seen
            data: last_seen
      filter:
        include:
          - entity_id: "geo_location.ais_*"
        exclude: []
