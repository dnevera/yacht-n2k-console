# The SINGLE top-level card of the `panel` view (see header.yaml).
#
# WHY custom:mod-card WRAPS EVERYTHING (do not "simplify" this away):
# card-mod does NOT support stack cards at all — it only hooks `ha-card` /
# `hui-card` / `hui-entities-card` / ... (grep card-mod.js: it has no notion of
# hui-*-stack-card). So an earlier revision that put `card_mod` directly on the
# outer `vertical-stack` was silently ignored: no outer margin, and the overlay
# positioning (`#root > *:nth-child(2)`) never applied — the target list simply
# stacked BELOW the map, which is exactly what was reported.
#
# `custom:mod-card` (shipped inside card-mod.js) renders a real `<ha-card>` of
# its own around any card, so `card_mod` reliably applies to it. That ha-card is
# the `position: relative` container; each overlay card then positions itself
# absolutely via its OWN card_mod (real ha-cards → card-mod definitely applies),
# so nothing depends on child indexes inside a stack's shadow root.
- type: custom:mod-card
  card_mod:
    style: |
      ha-card { position: relative; margin: 12px; overflow: hidden; }
  card:
    type: vertical-stack
    # helpers/build.py rewrites the map's zoom/height, the overlay geometry and
    # the full table's columns.
    cards:
      - id: map
        type: map
        # Own boat (GPS pin) + every live AIS target. The targets come from the
        # `ais_targets` custom integration's geo_location source (it reads the
        # gateway directly — the nmea2000 HA integration is NOT involved in AIS).
        entities:
          - entity: device_tracker.nevera
        geo_location_sources:
          - ais_targets
        default_zoom: 12
        card_mod:
          style: |
            ha-card { height: min(480px, calc(100vh - 104px)); }
            #map { height: min(480px, calc(100vh - 104px)) !important; }

      # ── Overlay header: expand/collapse toggle (always visible) ───────────
      # A `tile` card, not `entities`: entities always renders a full card with
      # header padding (bulky, and it was the card that looked stretched), while
      # tile is a single compact row with a native toggle.
      - id: overlay_toggle
        type: tile
        entity: input_boolean.ais_table_expanded
        name: AIS Targets
        icon: mdi:table-eye
        tap_action:
          action: toggle
        card_mod:
          # `:host`, NOT `ha-card`: card-mod injects its <style> into the card's
          # own shadow root, so `:host` targets the card ELEMENT. Positioning
          # only the inner ha-card left the element itself in the stack's flex
          # column — it kept reserving height (hence the browser scrollbar) and
          # got stretched by the column. `:host { position: absolute }` takes
          # the whole card out of flow, so the wrapper collapses to zero.
          style: |
            :host {
              position: absolute;
              top: 12px;
              right: 12px;
              z-index: 2;
              width: 300px;
            }

      # ── Collapsed overlay: compact side-bar (name + distance) ─────────────
      - type: conditional
        conditions:
          # `state_not` (not `state: "off"`) on purpose: it also matches while
          # the toggle is missing/unavailable, so the side-bar still renders
          # instead of the whole overlay silently disappearing.
          - condition: state
            entity: input_boolean.ais_table_expanded
            state_not: "on"
        card:
          id: detail_list_compact
          type: custom:flex-table-card
          # flex-table-card resolves the entity set itself (no auto-entities
          # wrapper): auto-entities re-called setConfig() on every change of
          # the vessel set, which rebuilt the table and RESET the column the
          # user had clicked to sort by. Doing the wildcard include natively
          # means setConfig() runs once, so the sort order sticks.
          entities:
            include: geo_location.ais_*
          # `strict` drops any row with a missing cell — which is exactly the
          # attribute-less "restored"/unavailable ghost rows left over in the
          # entity registry by older versions of the integration.
          strict: true
          clickable: true
          sort_by: state+
          columns:
            - name: Vessel
              data: name
            - name: Dist (km)
              data: state
              align: right
          card_mod:
            style: |
              :host {
                position: absolute;
                top: 84px;
                right: 12px;
                z-index: 2;
                width: 300px;
                max-height: calc(min(480px, calc(100vh - 104px)) - 96px);
              }
              ha-card {
                max-height: 100%;
                overflow: auto;
              }

      # ── Expanded overlay: the full table ─────────────────────────────────
      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.ais_table_expanded
            state: "on"
        card:
          id: detail_list
          type: custom:flex-table-card
          # Columns are regenerated from config.yaml's `detail_fields` by
          # helpers/build.py; the list below is only the as-shipped default
          # so this file stays valid on its own.
          entities:
            include: geo_location.ais_*
          strict: true
          clickable: true
          sort_by: state+
          columns:
            - name: Vessel
              data: name
            - name: Dist (km)
              data: state
              align: right
            - name: MMSI
              data: mmsi
            - name: Callsign
              data: callsign
            - name: Type
              data: ship_type
            - name: Length (m)
              data: length
            - name: Beam (m)
              data: beam
            - name: Destination
              data: destination
            - name: SOG (kn)
              data: sog
            - name: COG (°)
              data: cog
            - name: Heading (°)
              data: heading
            - name: Nav Status
              data: nav_status
            - name: Updated
              data: last_seen
          card_mod:
            style: |
              :host {
                position: absolute;
                top: 84px;
                right: 12px;
                z-index: 2;
                width: min(1100px, calc(100vw - 96px));
                max-height: calc(min(480px, calc(100vh - 104px)) - 96px);
              }
              ha-card {
                max-height: 100%;
                overflow: auto;
              }
